<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>qr.den1zz.dev</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Maple Mono NF"', '"Maple Mono"', 'monospace'],
            sans: ['"Maple Mono NF"', '"Maple Mono"', 'monospace'],
          },
          colors: {
            bg: '#000000',
            'bg-elevated': '#080808',
            panel: '#0a0a0a',
            'panel-border': 'rgba(255, 255, 255, 0.12)',
            accent: '#00f0ff',
            'accent-dim': '#008b99',
            'accent-glow': 'rgba(0, 240, 255, 0.25)',
            text: '#ffffff',
            'text-dim': '#a0a0a0',
            'text-faint': '#555555',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --font-mono: "Maple Mono NF", "Maple Mono", monospace;
      --bg: #000000;
      --bg-elevated: #080808;
      --panel: #0a0a0a;
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent: #00f0ff;
      --accent-dim: #008b99;
      --accent-glow: rgba(0, 240, 255, 0.25);
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --text-faint: #555555;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      font-family: "Maple Mono NF", "Maple Mono", monospace !important;
    }

    html {
      background: #000000;
      color-scheme: dark;
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: #000000;
      color: #ffffff;
      font-family: "Maple Mono NF", "Maple Mono", monospace !important;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    ::selection {
      background: rgba(0, 240, 255, 0.25);
      color: #00f0ff;
    }

    /* AMOLED Glass Panels */
    .glass-panel {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 1rem;
      background: #0a0a0a;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      transition: border-color 150ms ease;
    }

    .glass-panel:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Buttons */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.25rem;
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease, color 120ms ease;
      cursor: pointer;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button-primary {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #000000;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .button-primary:hover {
      background: #4df4ff;
      border-color: #4df4ff;
    }

    .button-white {
      border: 1px solid #ffffff;
      background: #ffffff;
      color: #000000;
    }

    .button-white:hover {
      background: #e0e0e0;
      border-color: #e0e0e0;
    }

    .button-secondary {
      border: 1px solid var(--panel-border);
      background: #111111;
      color: #ffffff;
    }

    .button-secondary:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    /* Viewfinder QR Stage Frame */
    .viewfinder-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 360px;
      max-height: 360px;
      margin: 0 auto;
      border-radius: 1rem;
      background-color: #000000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      overflow: hidden;
    }

    /* Guaranteed SVG scaling: fills frame without overflowing */
    .qr-svg-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-svg-wrapper svg {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain;
      display: block !important;
    }

    /* Custom Form Inputs */
    input[type="text"],
    input[type="password"],
    input[type="url"],
    textarea,
    select {
      background: #050505;
      border: 1px solid var(--panel-border);
      border-radius: 0.5rem;
      color: #ffffff;
      font-size: 0.875rem;
      padding: 0.625rem 0.875rem;
      transition: border-color 150ms ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="url"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    input[type="range"] {
      accent-color: var(--accent);
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #222222;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #444444;
    }
  </style>
</head>
<body class="min-h-screen bg-[#000000] text-[#ffffff]">
  <div id="app"></div>
</body>
</html>
