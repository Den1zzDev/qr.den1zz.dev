[package]
name = "qr-core"
version = "0.1.0"
edition = "2021"
authors = ["Den1zzDev"]
description = "Pure Rust core QR matrix generator, image halftoner, vector renderer, and scan verifier"
license = "MIT"
repository = "https://github.com/Den1zzDev/qr.den1zz.dev"
homepage = "https://qr.den1zz.dev"

[features]
default = ["export", "verifier"]
export = ["dep:image", "dep:crc32fast"]
verifier = ["dep:rqrr", "dep:image"]

[dependencies]
qrcode = { version = "0.14.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
rqrr = { version = "0.11", optional = true }
crc32fast = { version = "1.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
url = "2.5"

[dev-dependencies]
image = { version = "0.25", features = ["png", "jpeg"] }
